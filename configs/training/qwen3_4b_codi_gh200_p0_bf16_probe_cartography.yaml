method: codi

# Qwen3-4B P0 bf16 crash-repro probe (Phase 1.5 run #2):
# Reproduces the canonical bf16 no-detach failure mode (layer-0 q_proj.lora_A
# NaN around step ~30). Expected to fail — we want the pre-crash dgrad
# cartography, not a healthy trajectory. Paired with the V2 stable probe
# above for the Phase 1.5 gate decision (A / B / C per the spec).
#
# Diffs vs qwen3_4b_codi_gh200_probe.yaml: bumps max_steps from 200 → 60 so
# the run stops early even if the NaN gate misfires, and writes probe data
# to a distinct output dir so the earlier captured CSV isn't overwritten.

model:
  base_model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
  hf_token:
  lora_r: 16
  lora_alpha: 16
  lora_dropout: 0.1
  lora_init: true
  use_lora: true
  full_precision: true
  freeze_base_embeddings: true

data:
  dataset_names:
    - gsm8k_aug_nl
  registry_path: configs/datasets/full_registry.yaml
  cache_dir: .cache/huggingface
  max_samples_per_dataset: 4096
  include_last_cot: false
  answer_only: false
  max_token_num: 768
  validation_split_ratio: 0.0

runtime:
  model_max_length: 768
  num_latent: 2
  detach_latent_between_steps: false
  detach_cache_between_steps: false
  detach_keep_last_k: null
  detach_position_mode: all
  use_prj: true
  prj_dim: 2048
  prj_dropout: 0.0
  prj_no_ln: false
  prj_fp32: true
  prj_residual_gated: true
  prj_gate_init: 0.0
  distill_loss_div_std: true
  distill_loss_std_floor: 0.001
  distill_loss_type: smooth_l1
  distill_loss_factor: 5.0
  ref_loss_factor: 0.0
  remove_eos: true
  bf16: true
  fp32: false
  seed: 11
  use_chat_template: true
  chat_template_kwargs:
    enable_thinking: false
  probe_mode: true
  probe_output_dir: research_findings/dgrad_probe/qwen3_4b_p0_bf16_nodetach_cartography

trainer:
  output_dir: artifacts/train/qwen3_4b_codi_gh200_p0_bf16_probe_cartography
  logging_dir: artifacts/train/qwen3_4b_codi_gh200_p0_bf16_probe_cartography/logs
  logging_steps: 1
  logging_nan_inf_filter: false
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 2
  max_steps: 60
  num_train_epochs: 1
  learning_rate: 0.00002
  max_grad_norm: 1.0
  eval_strategy: "no"
  save_strategy: "no"
  save_safetensors: true
  weight_decay: 0.1
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  report_to: []
  dataloader_num_workers: 2
