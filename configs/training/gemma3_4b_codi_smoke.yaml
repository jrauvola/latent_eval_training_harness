method: codi

model:
  base_model_name_or_path: google/gemma-3-4b-it
  hf_token:
  lora_r: 128
  lora_alpha: 32
  lora_dropout: 0.1
  lora_init: true
  use_lora: true
  full_precision: true

data:
  dataset_names:
    - gsm8k_aug_nl
    - commonsense_cot
    - strategyqa_cot
    - prontoqa
  cache_dir: .cache/huggingface
  max_samples_per_dataset: 48
  include_last_cot: false
  answer_only: false
  max_token_num: 512
  validation_split_ratio: 0.1
  validation_max_samples: 24

runtime:
  model_max_length: 768
  num_latent: 6
  use_prj: true
  prj_dim: 2048
  prj_dropout: 0.0
  prj_no_ln: false
  distill_loss_div_std: true
  distill_loss_type: smooth_l1
  distill_loss_factor: 20.0
  ref_loss_factor: 1.0
  remove_eos: true
  bf16: true
  seed: 11

trainer:
  output_dir: artifacts/train/gemma3_4b_codi_smoke
  logging_dir: artifacts/train/gemma3_4b_codi_smoke/logs
  logging_steps: 2
  per_device_train_batch_size: 11
  gradient_accumulation_steps: 4
  max_steps: 12
  learning_rate: 0.0005
  max_grad_norm: 2.0
  eval_strategy: steps
  eval_steps: 6
  save_strategy: steps
  save_steps: 6
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  save_total_limit: 2
  save_safetensors: true
  weight_decay: 0.1
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  report_to: []
  dataloader_num_workers: 2
