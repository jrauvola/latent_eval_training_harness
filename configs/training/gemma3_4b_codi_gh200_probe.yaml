method: codi

# Track 1 probe config: Gemma-3-4B, bf16, NO detach, 200 steps.
# Used to produce dgrad_per_layer.csv + qk_rmsnorm_denom.csv for the
# "is the problem Q/K RMSNorm amplification?" hypothesis test.

model:
  base_model_name_or_path: google/gemma-3-4b-it
  hf_token:
  lora_r: 16
  lora_alpha: 16
  lora_dropout: 0.1
  lora_init: true
  use_lora: true
  full_precision: true
  freeze_base_embeddings: true

data:
  dataset_names:
    - gsm8k_aug_nl
  registry_path: configs/datasets/full_registry.yaml
  cache_dir: .cache/huggingface
  snapshot_dir: artifacts/datasets/training_snapshots
  max_samples_per_dataset: 4096
  include_last_cot: false
  answer_only: false
  max_token_num: 768
  validation_split_ratio: 0.0

runtime:
  model_max_length: 768
  num_latent: 2
  detach_latent_between_steps: false
  detach_cache_between_steps: false
  detach_keep_last_k: null
  detach_position_mode: all
  use_prj: true
  prj_dim: 2048
  prj_dropout: 0.0
  prj_no_ln: false
  prj_fp32: true
  prj_residual_gated: true
  prj_gate_init: 0.0
  distill_loss_div_std: true
  distill_loss_std_floor: 0.001
  distill_loss_type: smooth_l1
  distill_loss_factor: 5.0
  ref_loss_factor: 0.0
  remove_eos: true
  bf16: true
  fp32: false
  seed: 11
  probe_mode: true
  probe_output_dir: research_findings/dgrad_probe/gemma3_4b_bf16_nodetach

trainer:
  output_dir: artifacts/train/gemma3_4b_codi_gh200_probe
  logging_dir: artifacts/train/gemma3_4b_codi_gh200_probe/logs
  logging_steps: 1
  logging_nan_inf_filter: false
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  max_steps: 200
  num_train_epochs: 1
  learning_rate: 0.00002
  max_grad_norm: 1.0
  eval_strategy: "no"
  save_strategy: "no"
  save_safetensors: true
  weight_decay: 0.1
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  report_to: []
  dataloader_num_workers: 2
