method: codi

# Qwen3-4B Phase 0: fp32 + no detach control run (Track 2 Q-P0).
# Mirrors gemma3_4b_codi_gh200_phase0_fp32_no_detach.yaml but on Qwen3-4B-Instruct-2507.
# Hypothesis: Qwen3-4B (no Q/K RMSNorm) + fp32 + no detach trains cleanly, indicating
# Gemma-3-specific gradient pathology rather than universal CODI failure mode.

model:
  base_model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
  hf_token:
  lora_r: 16
  lora_alpha: 16
  lora_dropout: 0.1
  lora_init: true
  use_lora: true
  full_precision: true
  freeze_base_embeddings: true

data:
  dataset_names:
    - gsm8k_aug_nl
    - commonsense_cot
    - strategyqa_cot
    - prontoqa
  registry_ids:
    - numinamath_15
    - natural_reasoning
    - proofwriter
  registry_path: configs/datasets/full_registry.yaml
  cache_dir: .cache/huggingface
  max_samples_per_dataset: 8192
  include_last_cot: false
  answer_only: false
  max_token_num: 768
  validation_split_ratio: 0.05
  validation_max_samples: 2048

runtime:
  model_max_length: 768
  num_latent: 2
  detach_latent_between_steps: false
  detach_cache_between_steps: false
  detach_keep_last_k: null
  detach_position_mode: all
  use_prj: true
  prj_dim: 2048
  prj_dropout: 0.0
  prj_no_ln: false
  prj_fp32: true
  prj_residual_gated: true
  prj_gate_init: 0.0
  distill_loss_div_std: true
  distill_loss_std_floor: 0.001
  distill_loss_type: smooth_l1
  distill_loss_factor: 5.0
  ref_loss_factor: 0.0
  remove_eos: true
  bf16: false
  fp32: true
  seed: 11
  use_chat_template: true
  chat_template_kwargs:
    enable_thinking: false

trainer:
  output_dir: artifacts/train/qwen3_4b_codi_gh200_phase0_fp32_no_detach
  logging_dir: artifacts/train/qwen3_4b_codi_gh200_phase0_fp32_no_detach/logs
  logging_steps: 1
  logging_nan_inf_filter: false
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  learning_rate: 0.00002
  max_grad_norm: 1.0
  eval_strategy: "no"
  save_strategy: steps
  save_steps: 500
  load_best_model_at_end: false
  save_total_limit: 100
  save_safetensors: true
  weight_decay: 0.1
  warmup_ratio: 0.3
  lr_scheduler_type: cosine
  report_to: []
  dataloader_num_workers: 4
