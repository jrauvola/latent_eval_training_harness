method: sim_cot

# Qwen3-4B SIM-CoT shared-lm_head SMOKE TEST (10 steps, bs=1, ga=1).
#
# Purpose: validate memory footprint of the shared-lm_head aux-decoder
# fallback while LT-Tuning is concurrently training on the same GH200.
# The full-LM aux decoder (qwen3_4b_codi_gh200_sim_cot_v2_detach.yaml)
# OOMed at step 1 when LT-Tuning was using ~46 GB. This variant flips
# aux_decoder_full_lm -> false so the aux CE runs through a single
# TransformerEncoder layer whose outputs are fed into the base model's
# lm_head (shared-head approximation, not full-LM).
#
# Success criterion:
#   - init succeeds (no TypeError in resize path — shared-head path
#     does NOT call resize_token_embeddings so the LT-Tuning fixes
#     (672b4cd, 8273334) are not required here)
#   - 10 forward+backward steps complete without OOM
#   - peak GPU memory from nvidia-smi stays under ~35 GB additional
#     (48 GB headroom minus safety margin)
#
# If shared-head smoke passes, the full 5299-step run is safe to launch
# AFTER LT-Tuning finishes (when full GPU is free again). If it still
# OOMs with LT-Tuning co-resident, wait for LT-Tuning to finish.

model:
  base_model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
  hf_token:
  lora_r: 128
  lora_alpha: 32
  lora_dropout: 0.05
  lora_init: true
  use_lora: true
  full_precision: true
  freeze_base_embeddings: true

data:
  dataset_names:
    - gsm8k_aug_nl
    - commonsense_cot
    - strategyqa_cot
    - prontoqa
  registry_ids:
    - numinamath_15
    - natural_reasoning
    - proofwriter
  registry_path: configs/datasets/full_registry.yaml
  cache_dir: .cache/huggingface
  # Trimmed from 8192 -> 32 per dataset so the smoke test doesn't wait
  # on dataset loading; with bs=1, ga=1, max_steps=10 we need only ~10
  # samples total.
  max_samples_per_dataset: 32
  include_last_cot: false
  answer_only: false
  max_token_num: 768
  validation_split_ratio: 0.05
  validation_max_samples: 2048

runtime:
  model_max_length: 768
  num_latent: 4

  # V2 step-boundary detach + keep_last_2 — identical to V2 headline.
  detach_latent_between_steps: true
  detach_cache_between_steps: true
  detach_keep_last_k: 2
  detach_position_mode: all

  # Projection module — V2 recipe.
  use_prj: true
  prj_dim: 2048
  prj_dropout: 0.0
  prj_no_ln: false
  prj_fp32: true
  prj_residual_gated: true
  prj_gate_init: 0.0

  # Distillation + reference losses — V2 recipe.
  distill_loss_div_std: true
  distill_loss_std_floor: 0.001
  distill_loss_type: smooth_l1
  distill_loss_factor: 20.0
  ref_loss_factor: 1.0

  remove_eos: true
  bf16: true
  fp32: false
  seed: 11
  use_chat_template: true
  chat_template_kwargs:
    enable_thinking: false

  # SIM-CoT aux decoder — SHARED-HEAD fallback (memory-cheap).
  aux_decoder_enabled: true
  aux_decoder_full_lm: false
  aux_decoder_explain_loss_factor: 1.0
  aux_decoder_shared_head_layers: 1

trainer:
  output_dir: artifacts/train/qwen3_4b_codi_gh200_sim_cot_shared_head_smoke
  logging_dir: artifacts/train/qwen3_4b_codi_gh200_sim_cot_shared_head_smoke/logs
  logging_steps: 1
  logging_nan_inf_filter: false
  # Smoke config: bs=1, ga=1 to minimize peak memory while LT-Tuning
  # is co-resident on the same GH200.
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  learning_rate: 0.0001        # SIM-CoT paper's 1e-4 with cosine decay.
  max_grad_norm: 2.0            # SIM-CoT paper's value (vs V2's 1.0).
  eval_strategy: "no"
  save_strategy: "no"           # Smoke run — no checkpoints.
  load_best_model_at_end: false
  save_total_limit: 1
  save_safetensors: true
  weight_decay: 0.1
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  report_to: []
  dataloader_num_workers: 2
  # 10 steps = smoke test scope.
  max_steps: 10
