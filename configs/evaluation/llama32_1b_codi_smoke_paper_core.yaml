runtime:
  output_dir: artifacts/eval/llama32_1b_codi_smoke_paper_core
  cache_dir: .cache/huggingface
  snapshot_dir: artifacts/datasets
  device: auto
  batch_size: 8
  progress_log_interval_batches: 5
  max_examples_per_benchmark: 8
  max_new_tokens: 128
  greedy: true
  temperature: 0.1
  top_k: 40
  top_p: 0.95

benchmarks:
  - gsm8k
  - svamp
  - gsm-hard
  - multi-arith
  - commonsense_qa

models:
  - name: llama32_1b_codi_smoke
    checkpoint_source: artifacts/train/llama32_1b_codi_smoke
    checkpoint_type: local_path
    model_kind: latent_runtime
    inference_strategy: latent_cot
    model:
      base_model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
      lora_r: 128
      lora_alpha: 32
      use_lora: true
    runtime:
      model_max_length: 512
      num_latent: 6
      use_prj: true
      prj_dim: 2048
      prj_dropout: 0.0
      remove_eos: true
      bf16: true
