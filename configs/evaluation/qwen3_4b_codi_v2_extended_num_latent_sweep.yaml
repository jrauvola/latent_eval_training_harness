# Phase 1 Track 1 — Extended num_latent sweep on the Q-V2 bf16 headline checkpoint.
#
# Spec: docs/superpowers/specs/2026-04-21-synthesis-and-scaling-design.md
# Motivation: Phase 1 (num_latent ∈ {0,2,4,8}) showed V2 bf16 is the only variant with
# monotonically rising latent-use. We need to know whether that curve plateaus, keeps
# climbing, or reverses at n=16 and n=32. This extends the sweep with no retraining.
#
# Skips latent-trace and KV-cache dumps (we already have those at n=0,2,4,8; n=16/32
# is accuracy-curve-only). Writes to a dedicated output dir so it does not clobber
# Phase 1 artifacts.

runtime:
  output_dir: artifacts/eval/qwen3_4b_codi_v2_extended_sweep
  cache_dir: .cache/huggingface
  snapshot_dir: artifacts/datasets
  device: auto
  batch_size: 4
  progress_log_interval_batches: 10
  max_examples_per_benchmark: null
  max_new_tokens: 256
  greedy: true
  temperature: 0.1
  top_k: 40
  top_p: 0.95

  num_latent_sweep: [16, 32]
  skip_latent_injection_at_zero: true
  dump_latent_traces: false
  dump_kv_cache: false
  persistence_every_examples: 32
  seed: 11

benchmarks:
  - gsm8k
  - gsm-hard
  - svamp

models:
  - name: qwen3_4b_codi_bf16_kv_latent_detach_last_2
    checkpoint_source: jrauvola/qwen3-4b-codi-bf16-kv-latent-detach-last-2
    checkpoint_type: hf_repo
    model_kind: latent_runtime
    inference_strategy: latent_cot
    model:
      base_model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
      lora_r: 16
      lora_alpha: 16
      lora_dropout: 0.1
      use_lora: true
      full_precision: true
      freeze_base_embeddings: true
    runtime:
      # Extended model_max_length to comfortably host num_latent=32 + answer tokens.
      model_max_length: 1024
      num_latent: 4
      detach_latent_between_steps: true
      detach_cache_between_steps: true
      detach_keep_last_k: 2
      detach_position_mode: all
      use_prj: true
      prj_dim: 2048
      prj_dropout: 0.0
      prj_no_ln: false
      prj_fp32: true
      prj_residual_gated: true
      prj_gate_init: 0.0
      remove_eos: true
      bf16: true
      fp32: false
      seed: 11
      use_chat_template: true
      chat_template_kwargs:
        enable_thinking: false
