# F4 — Latent-KV Ablation probe (V2 bf16 only, num_latent=8).
#
# Runs the latent rollout normally (so encoder output + num_latent=8 latent
# hidden states populate the KV cache) and then slices the latent positions
# off the KV cache before the final-answer generation loop. If accuracy holds
# relative to Phase 1 baseline (V2 × gsm8k × n=8 = 0.162, V2 × svamp × n=8 =
# 0.420), the latents are inert — the model is emitting a post-encoder
# format/answer prior.
#
# Config mirrors qwen3_4b_codi_phase1_full.yaml for V2 bf16 but:
#   * num_latent_sweep: [8]
#   * benchmarks: [gsm8k, svamp]
#   * ablate_latent_kv_before_answer: true
#   * skip trace + KV dumps to cut wall time.

runtime:
  output_dir: artifacts/eval/qwen3_4b_codi_v2_f4_ablation
  cache_dir: .cache/huggingface
  snapshot_dir: artifacts/datasets
  device: auto
  batch_size: 4
  progress_log_interval_batches: 10
  max_examples_per_benchmark: null
  max_new_tokens: 256
  greedy: true
  temperature: 0.1
  top_k: 40
  top_p: 0.95

  num_latent_sweep: [8]
  skip_latent_injection_at_zero: true
  dump_latent_traces: false
  dump_kv_cache: false
  persistence_every_examples: 32
  seed: 11

  # F4 knob.
  ablate_latent_kv_before_answer: true

benchmarks:
  - gsm8k
  - svamp

models:
  # Q-V2 — bf16 headline: step-boundary KV+latent detach, keep_last_2.
  - name: qwen3_4b_codi_bf16_kv_latent_detach_last_2
    checkpoint_source: jrauvola/qwen3-4b-codi-bf16-kv-latent-detach-last-2
    checkpoint_type: hf_repo
    model_kind: latent_runtime
    inference_strategy: latent_cot
    model:
      base_model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
      lora_r: 16
      lora_alpha: 16
      lora_dropout: 0.1
      use_lora: true
      full_precision: true
      freeze_base_embeddings: true
    runtime:
      model_max_length: 768
      num_latent: 4
      detach_latent_between_steps: true
      detach_cache_between_steps: true
      detach_keep_last_k: 2
      detach_position_mode: all
      use_prj: true
      prj_dim: 2048
      prj_dropout: 0.0
      prj_no_ln: false
      prj_fp32: true
      prj_residual_gated: true
      prj_gate_init: 0.0
      remove_eos: true
      bf16: true
      fp32: false
      seed: 11
      use_chat_template: true
      chat_template_kwargs:
        enable_thinking: false
