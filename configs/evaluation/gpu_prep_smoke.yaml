# Pre-GPU sanity check: same model matrix as `broader_suite_plus_p3_gemma3_gh200.yaml`
# plus Laura's 8B snapshot, with tiny caps so runs finish in minutes (not hours).
#
# Usage (from repo root):
#   export HF_TOKEN=...   # required for Llama 3.2 1B; recommended for Gemma
#   bash scripts/run_gpu_prep_smoke.sh
#
# On Apple Silicon you can set `device: mps` below instead of `auto` (CUDA unavailable).
#
# **Mac / RAM-limited:** use `configs/evaluation/gpu_prep_smoke_mac.yaml` or
#   bash scripts/run_gpu_prep_smoke_mac.sh
# (drops Laura 8B only; everything else matches this file).

runtime:
  output_dir: artifacts/eval/gpu_prep_smoke
  cache_dir: .cache/huggingface
  snapshot_dir: artifacts/datasets
  device: auto
  batch_size: 1
  progress_log_interval_batches: 1
  max_examples_per_benchmark: 2
  max_new_tokens: 64
  greedy: true
  temperature: 0.1
  top_k: 40
  top_p: 0.95

# Short benchmark list; enough to touch tokenizer + generation paths
benchmarks:
  - multi-arith
  - gsm8k
  - p3_arc_challenge_letter

models:
  - name: base_gpt2
    checkpoint_source:
    checkpoint_type: base_model
    model_kind: causal_lm
    inference_strategy: standard_generation
    model:
      base_model_name_or_path: gpt2
      use_lora: false
    runtime:
      model_max_length: 512
      num_latent: 0
      use_prj: false
      bf16: false
  - name: codi_gpt2_official
    checkpoint_source: zen-E/CODI-gpt2
    checkpoint_type: hf_repo
    model_kind: latent_runtime
    inference_strategy: latent_cot
    model:
      base_model_name_or_path: gpt2
      lora_r: 128
      lora_alpha: 32
      use_lora: true
    runtime:
      model_max_length: 512
      num_latent: 6
      use_prj: true
      prj_dim: 768
      prj_dropout: 0.0
      remove_eos: true
      bf16: false
  - name: base_llama32_1b_instruct
    checkpoint_source:
    checkpoint_type: base_model
    model_kind: causal_lm
    inference_strategy: standard_generation
    model:
      base_model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
      use_lora: false
    runtime:
      model_max_length: 512
      num_latent: 0
      use_prj: false
      bf16: false
  - name: codi_llama32_1b_official
    checkpoint_source: zen-E/CODI-llama3.2-1b-Instruct
    checkpoint_type: hf_repo
    model_kind: latent_runtime
    inference_strategy: latent_cot
    model:
      base_model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
      lora_r: 128
      lora_alpha: 32
      use_lora: true
    runtime:
      model_max_length: 512
      num_latent: 6
      use_prj: true
      prj_dim: 2048
      prj_dropout: 0.0
      remove_eos: true
      bf16: false
  - name: base_gemma3_4b_it
    checkpoint_source:
    checkpoint_type: base_model
    model_kind: causal_lm
    inference_strategy: standard_generation
    model:
      base_model_name_or_path: google/gemma-3-4b-it
      use_lora: false
    runtime:
      model_max_length: 512
      num_latent: 0
      use_prj: false
      bf16: false
  - name: base_qwen3_4b_instruct
    checkpoint_source:
    checkpoint_type: base_model
    model_kind: causal_lm
    inference_strategy: standard_generation
    model:
      base_model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
      use_lora: false
    runtime:
      model_max_length: 512
      num_latent: 0
      use_prj: false
      bf16: false
  - name: laura_llama8b_fft_instruct59
    checkpoint_source: LauraGG/latent-reasoning-llama8b-fft
    checkpoint_type: hf_pretrained
    hf_subfolder: coconut_instruct_59pct
    model_kind: causal_lm
    inference_strategy: standard_generation
    model:
      base_model_name_or_path: LauraGG/latent-reasoning-llama8b-fft
      use_lora: false
    runtime:
      model_max_length: 1024
      num_latent: 0
      use_prj: false
      bf16: true
